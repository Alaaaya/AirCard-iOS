name: Windows handoff validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  handoff:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test actual CryptoKit handoff
        run: |
          mkdir -p hk/Sources/WindowsHandoffKit hk/Tests/WindowsHandoffKitTests
          cp ios-app/Apps/WindowsHandoffCrypto.swift hk/Sources/WindowsHandoffKit/
          cp tests/WindowsHandoffTests.swift hk/Tests/WindowsHandoffKitTests/
          cat > hk/Package.swift <<'EOF'
          // swift-tools-version:5.9
          import PackageDescription
          let package = Package(name: "WindowsHandoffKit", platforms: [.macOS(.v13)],
            products: [.library(name: "WindowsHandoffKit", targets: ["WindowsHandoffKit"])],
            targets: [.target(name: "WindowsHandoffKit"), .testTarget(name: "WindowsHandoffKitTests", dependencies: ["WindowsHandoffKit"])])
          EOF
          cd hk && swift test
      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate
      - name: Typecheck and link iOS application without signing
        run: |
          xcodebuild -project AirCard-iOS.xcodeproj -scheme AirCard-iOS \
            -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath /tmp/mirsa-handoff-build CODE_SIGNING_ALLOWED=NO build
