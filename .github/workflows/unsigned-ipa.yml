name: Unsigned AirCard IPA
on:
  workflow_dispatch:
  push:
    branches: [apps-sideloader]
permissions:
  contents: write
jobs:
  build:
    runs-on: ${{ vars.MAC_RUNNER || 'macos-14' }}
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then XC=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1); fi
          if [ -z "$XC" ]; then XC=$(xcode-select -p | sed 's#/Contents/Developer##'); fi
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-core

      # rust-core changed (sideloader + container signer), so rebuild the
      # static library instead of using the prebuilt AirliftFFI.xcframework.
      - name: Build AirliftFFI for iOS (device)
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        run: |
          cd rust-core
          cargo build --release --target aarch64-apple-ios
          cd ..
          rm -rf AirliftFFI.xcframework
          xcodebuild -create-xcframework \
            -library rust-core/target/aarch64-apple-ios/release/libairlift_ffi.a \
            -headers rust-core/include \
            -output AirliftFFI.xcframework

      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate

      - name: Stamp build number
        run: /usr/libexec/PlistBuddy -c "Add :MirsaBuild string ${{ github.run_number }}" ios-app/Info.plist

      - name: Build unsigned IPA
        run: bash build-ipa.sh

      - uses: actions/upload-artifact@v4
        with:
          name: AirCard-apps-sideloader-unsigned
          path: build/AirCard-iOS.ipa

      # Mirsa checks the latest release on launch and offers to update itself.
      - name: Publish release for in-app updates
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/AirCard-iOS.ipa build/Mirsa.ipa
          git log -1 --pretty=%B > notes.txt
          gh release create "build-${{ github.run_number }}" build/Mirsa.ipa \
            --title "Mirsa build ${{ github.run_number }}" --notes-file notes.txt \
            --target "${{ github.sha }}" --latest
