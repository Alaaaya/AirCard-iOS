name: Unsigned video wallpaper IPA
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned IPA
        run: bash build-ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: AirCard-video-wallpaper-unsigned
          path: build/AirCard-iOS.ipa
